# tamtam inspected 2026-05-21
#
# cooldown 7 days = pnpm-workspace.yaml's `minimumReleaseAge: 10080` (minutes).
# Dependabot's default cooldown is 3 days; with pnpm's strict release-age mode
# a version update that picks a release younger than 7 days fails the
# Dependabot job itself with ERR_PNPM_STRICT_MIN_RELEASE_AGE_REQUIRES_SAVE
# (the grouped npm run failed on it 2026-09-13, -20 and -27). `schedule`, `cooldown` and
# `open-pull-requests-limit` apply to version updates only; security updates
# are never delayed.
#
# One Dependabot version-update PR at a time: the version updates of every
# ecosystem below join the single `dependencies` multi-ecosystem group (one
# weekly PR; open-pull-requests-limit: 1 on each entry), and semver-major
# version updates are ignored so one breaking major cannot block that PR;
# majors are bumped by hand. Security updates cannot join a multi-ecosystem
# group, so they stay grouped per ecosystem (`applies-to: security-updates`);
# open-pull-requests-limit and the major ignore do not apply to them.
version: 2
multi-ecosystem-groups:
  dependencies:
    open-pull-requests-limit: 1    # the limit belongs on the group, not on its member entries
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Warsaw}
updates:
  - package-ecosystem: npm
    directory: "/"
    cooldown:
      default-days: 7
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      # Majors are done by hand: one breaking major would hold up the single grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      # Majors are done by hand: one breaking major would hold up the single grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
