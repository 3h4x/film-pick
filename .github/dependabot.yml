# tamtam inspected 2026-05-21
#
# cooldown 7 days = pnpm-workspace.yaml's `minimumReleaseAge: 10080` (minutes).
# Dependabot's default cooldown is 3 days; with pnpm's strict release-age mode
# a version update that picks a release younger than 7 days fails the
# Dependabot job itself with ERR_PNPM_STRICT_MIN_RELEASE_AGE_REQUIRES_SAVE
# (the grouped npm run failed on it 2026-09-13, -20 and -27). `schedule`, `cooldown` and
# `open-pull-requests-limit` apply to version updates only; security updates
# are never delayed.
#
# Grouping (3h4x, 2026-10-10): one grouped PR per ecosystem and directory, for
# version updates (<eco>-minor-patch) and for security updates (<eco>-security).
# This replaced `multi-ecosystem-groups` (2026-09-30 to 2026-10-10). While an entry
# belonged to a multi-ecosystem group, Dependabot ignored its `applies-to:
# security-updates` group and opened one PR per advisory, each conflicting with the
# others' lockfile; merging one made Dependabot open the next. Do not move back to
# multi-ecosystem-groups for that reason.
# Semver-major version updates stay ignored, so one breaking major cannot hold a
# grouped PR red; majors are bumped by hand. Security updates drop update-type
# ignores, so they still get majors when the fix needs one.
version: 2
updates:
  - package-ecosystem: npm
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Warsaw}
    open-pull-requests-limit: 1 # version PRs only; security PRs are not capped
    directory: "/"
    cooldown:
      default-days: 7
    ignore:
      # Majors are done by hand: one breaking major would hold up a grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Warsaw}
    open-pull-requests-limit: 1 # version PRs only; security PRs are not capped
    directory: "/"
    cooldown:
      default-days: 7
    ignore:
      # Majors are done by hand: one breaking major would hold up a grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
